name: pre-commit

# The local pre-commit hooks (ruff, mypy, secret-scanning) are also
# run on every PR + push-to-main as a CI belt-and-braces: catches
# a contributor who doesn't have the local hook set up yet.
#
# Cheap (~30 s when clean) and exits non-zero on the same things the
# local hook would flag. If this turns red on a PR, the local hook
# will too — install with `pip install pre-commit && pre-commit install`.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pre-commit
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit run --all-files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run pre-commit
        # Pin to the major version our .pre-commit-config.yaml expects.
        # Bumping is a deliberate change, not an automatic one.
        run: |
          python -m pip install --upgrade pip
          pip install "pre-commit>=3.5,<4"
          pre-commit run --all-files --show-diff-on-failure
