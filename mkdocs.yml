site_name: qscreen-filing-tool
site_description: >-
  Jurisdiction-agnostic PDF → lossless filing JSON (browser app + CLI).
  Pluggable profiles, math-identity gates, idempotent batch, and stable
  text fingerprints. Originally QSE, now pluggable.
site_url: https://mine-fnl.github.io/qstocks-filing-tool/
repo_url: https://github.com/Mine-FNL/qstocks-filing-tool
repo_name: Mine-FNL/qstocks-filing-tool
edit_uri: edit/main/docs/site/

docs_dir: docs/site
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
  font:
    text: Inter
    code: JetBrains Mono

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Mine-FNL/qstocks-filing-tool
      name: qscreen-filing-tool on GitHub
  generator: false

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.smartsymbols
  - pymdownx.betterem:
      smart_enable: all

plugins:
  - search

nav:
  - Home: index.md
  - Getting started:
      - Installation: install.md
      - Usage: usage.md
  - Reference:
      - Architecture: architecture.md
      - Jurisdictions (profiles): jurisdictions.md
      - Golden-set bench: bench.md
      - CI workflows: ci.md
  - Show & Tell:
      - Long-form pitch: SHOW_HN.md
