[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qscreen-filing-tool"
description = "Turn a PDF financial filing into lossless, auditable JSON. Jurisdiction-agnostic engine (QSE-shipping, AE/SA/KW-ready) with math-identity gates, idempotent batch, multi-page Arabic/English language detection, stable SHA-256 text fingerprints, and a Flask browser app. 485 unit tests, 80.6% bench accuracy on the 8-case golden set, signed wheel+sdist+SBOM, SLSA Build L3 attested."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dynamic = ["version"]
authors = [
    { name = "QScreen contributors" },
    { name = "Mine-FNL", email = "noreply@mine-fnl.example" },
]
keywords = [
    "pdf",
    "extraction",
    "financial-reporting",
    "ifrs",
    "aaoifi",
    "islamic-finance",
    "xbrl",
    "filings",
    "sec-edgar",
    "qatar-stock-exchange",
    "abu-dhabi-stock-exchange",
    "pdfplumber",
    "fingerprinting",
    "ingestion",
    "compliance",
    "audit-trail",
    "schema-stable",
    "lossless",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
    "Environment :: Web Environment :: Flask",
]
dependencies = [
    "pdfplumber>=0.11",
    "requests>=2.31",
    "flask>=3.0",
]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]                                   # --export xlsx
ocr = ["rapidocr-onnxruntime"]                            # read scanned pages offline (pip-only, no system software)
ocr-tesseract = ["pytesseract>=0.3.10"]                   # optional alternative if you already have the tesseract binary
dev = ["pytest>=7", "openpyxl>=3.1"]

[project.urls]
"Source" = "https://github.com/Mine-FNL/qstocks-filing-tool"
"Issues" = "https://github.com/Mine-FNL/qstocks-filing-tool/issues"
"Documentation" = "https://mine-fnl.github.io/qstocks-filing-tool/"
"Live bench report" = "https://mine-fnl.github.io/qstocks-filing-tool/demo.html"
"Supply chain & security" = "https://github.com/Mine-FNL/qstocks-filing-tool/blob/main/SECURITY.md"

[project.scripts]
qscreen-ingest = "qscreen_ingest:main"
qscreen-app = "qscreen_app:main"

[tool.setuptools]
py-modules = [
    "qscreen_ingest", "qscreen_app", "qscreen_series", "qscreen_analyze",
    "qscreen_dcf", "qscreen_report", "qscreen_portfolio", "qscreen_workbook",
    "qscreen_statements", "qscreen_charts", "qscreen_periods",
    # Modules shipped in 1.2.0
    "qscreen_gates",            # skeleton + math-identity gates
    "qscreen_state",            # resumable batch state (sqlite)
    # Modules shipped in 1.3.0 – 1.6.0
    "qscreen_eval",             # 1.3.0 — golden-set evaluation harness
    "qscreen_autodetect",       # 1.4.0 — auto-detect sector/period/framework
    "qscreen_langdetect",       # 1.5.0 — bilingual Arabic/English classifier
    "qscreen_fingerprint",      # 1.6.0 — stable text fingerprints + diff
]
# Two packages: profiles/ (jurisdiction-aware, ships Qatar data + pre_flag
# catalog), qatar/ (back-compat shim re-exporting profiles.qatar).
packages = ["qatar", "profiles"]

[tool.setuptools.package-data]
"profiles.qatar" = ["data/*.json"]

[tool.setuptools.dynamic]
version = { attr = "qscreen_ingest.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]

# -----------------------------------------------------------------------------
# Code quality (industry-leading defaults)
# -----------------------------------------------------------------------------

[tool.ruff]
# A pragmatic line length — matches PEP 8's 79-ish but accommodates modern
# docstrings, URLs, and the long CLI tables in the engine.
line-length = 100
target-version = "py39"
extend-exclude = [
    "build",
    "dist",
    "site",
    ".venv",
    "qscreen_filing_tool.egg-info",
    "tests/golden/cases",
]

[tool.ruff.lint]
# E/F/W: pycodestyle / pyflakes / pycodestyle warnings. The baseline.
# I: isort (imports). B: bugbear (likely bugs). UP: pyupgrade (modern syntax).
# SIM: simplify. C4: comprehensions. RUF: ruff-specific.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    "E501",   # line-length — handled by formatter
    "B008",   # function-call-in-default-arg — common in argparse
    "B904",   # raise-from — large surface to retrofit
    "RUF001", # ambiguous unicode chars — engine prints 🧪 / ✅ / ⚠️ / … intentionally
    "RUF002", # ambiguous × in docstrings — math notation (growth × discount) reads better as ×
    "RUF003", # ambiguous −/– in docstrings + comments — math notation reads better as −
    "RUF012", # mutable-class-default-attr — pydantic-style attrs we use
    # Cosmetic rules that don't affect runtime safety; re-enable
    # incrementally as modules reach clean state.
    "SIM102", # collapsible-if — sometimes more readable nested
    "SIM108", # ternary — engine prefers explicit if/else
    "E402",   # module-import-not-at-top — common in sys.path-mutating scripts
    "UP031",  # printf-string-formatting — legacy test fixtures use % formatting
    "B007",   # unused-loop-control-variable — common pattern in enumerate()
]

[tool.ruff.lint.per-file-ignores]
# Tests allow longer lines + looser unused-import rules, and often
# embed intentional unicode (×, …, 🧪) inside assertion strings.
"tests/**/*.py" = ["F401", "F811", "RUF001", "B011"]  # B011: asserts-with-tuple
# Generated / vendored data files
"profiles/qatar/data/*.json" = ["E", "W"]
# Bench fixtures + golden-set case files contain deliberate unicode
"tests/golden/cases/*.txt" = ["ALL"]
"tests/golden/*.json" = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.9"
# Be lenient on legacy modules; tighten as type hints land.
disallow_untyped_defs = false
disallow_untyped_calls = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
ignore_missing_imports = true
exclude = [
    "^build/",
    "^dist/",
    "^site/",
    "^\\.venv/",
    "^qscreen_filing_tool\\.egg-info/",
    "^tests/golden/cases/",
]

[[tool.mypy.overrides]]
# Tighter for the core engine — entry points + modules with strong test
# coverage. These should aspire to `disallow_untyped_defs = true` over time.
module = [
    "qscreen_ingest",
    "qscreen_gates",
    "qscreen_state",
    "qscreen_fingerprint",
    "qscreen_langdetect",
    "qscreen_autodetect",
]
disallow_untyped_defs = true
warn_unused_ignores = true
