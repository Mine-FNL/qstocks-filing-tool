name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          # Installed as an editable package so the test suite imports the
          # same way production code does (one canonical entry point per
          # CLI, package-data for profiles/<jurisdiction>/data/*.json).
          pip install -e ".[dev]"

      - name: Offline self-test (no third-party deps required)
        run: python -m qscreen_ingest --self-test

      - name: Run test suite
        run: pytest -q --maxfail=1 --durations=10

      # Golden-set extraction bench. Reports accuracy on hand-verified
      # targets spanning the 5 archetypes + 3 known-tricky shapes. Does
      # NOT block merging — the regression threshold is "worse than
      # the BASELINE", not "exactly equal". When the bench regresses below
      # baseline the PR shows the diff in the artifacts for review.
      - name: Golden-set extraction bench (informational)
        if: always()
        run: |
          python qscreen_eval.py --md --out /tmp/eval.md || true
          echo "## Golden-set eval (informational; non-gating)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          head -30 /tmp/eval.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload eval report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: golden-eval-${{ matrix.python-version }}
          path: /tmp/eval.md
          if-no-files-found: ignore

  app-smoke:
    name: Flask app smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Boot the Flask app on a random port
        env:
          QSCREEN_APP_HOST: 127.0.0.1
          QSCREEN_APP_PORT: "18765"
        run: |
          python -m qscreen_app &
          APP_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:18765/healthz" >/dev/null; then break; fi
            sleep 1
          done
          # Assert via Python helper script (rather than a grep) so the
          # JSON parsing is robust to whatever spacing Flask's jsonify picks.
          python scripts/ci_healthz_assert.py http://127.0.0.1:18765/healthz \
            || (echo "healthz didn't return ok"; kill $APP_PID; exit 1)
          kill $APP_PID || true
