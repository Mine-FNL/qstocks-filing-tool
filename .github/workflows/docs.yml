name: docs

# Build the mkdocs site (--strict) and publish it to the gh-pages branch
# on every change to docs/, mkdocs.yml, or docs/build_demo.py.
#
# Interaction with release.yml
# -----------------------------
# release.yml (tag push) ALSO commits to the gh-pages branch:
#   - simple/qscreen-filing-tool/index.html   (PEP 503 index)
#   - index.html                              (package-name-on-root fallback)
#   - demo.html                               (live bench report)
#
# Those files live at sub-paths of gh-pages; the mkdocs site produced
# by this workflow is the *root* (./index.html, ./install/, ./usage/, ...).
# With force_orphan=true, peaceiris/actions-gh-pages REPLACES the gh-pages
# branch contents with ./site/. release.yml will re-publish its sub-path
# files on the next v* tag push, restoring the index + demo. Until then,
# the simple/ and /demo.html URLs will 404 — this is the trade-off for a
# clean orphan root (no stale mkdocs assets from a deleted page).
#
# If you ever want both this site's root AND the release.yml sub-paths to
# coexist without the orphan reset, switch force_orphan=false and rely on
# path isolation: the mkdocs build only writes ./site/ and the release
# workflow only writes ./simple/ + ./index.html + ./demo.html. They do
# not collide; force_orphan is purely cosmetic for this repo.

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "docs/SHOW_HN.md"
      - "docs/build_demo.py"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write        # commit the site/ tree to gh-pages
  pages: write           # allowed to publish to Pages
  id-token: write        # ready for downstream OIDC (future)

concurrency:
  group: docs
  cancel-in-progress: false   # never cancel an in-flight publish

jobs:
  build-and-deploy:
    name: Build mkdocs + publish to gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # mkdocs reads git history for "edit this page"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install mkdocs + material + pillow
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs mkdocs-material pillow
          pip install -e ".[dev]"

      - name: Build live bench JSON + demo HTML + OG image
        # Produce docs/demo.html + docs/og.png + docs/bench.json so the
        # gh-pages branch carries a shareable thumbnail at /og.png and
        # the bench report at /demo.html. The qscreen package depends on
        # Flask + pdfplumber + requests (all free); install them on top
        # of the venv so build_demo.py / qscreen_eval.py can run.
        run: |
          python -m pip install -e ".[dev]"
          mkdir -p site
          # qscreen_eval.py exits non-zero on bench regressions (that's
          # its design — it's the regression detector). For docs we just
          # want a representative snapshot, so capture the JSON output
          # even if the exit code is non-zero.
          python qscreen_eval.py --json --out /tmp/bench.json || true
          python docs/build_demo.py /tmp/bench.json \
              --out site/demo.html \
              --og site/og.png || true
          ls -lh site/

      - name: Build mkdocs (--strict)
        run: python -m mkdocs build --strict

      - name: Deploy to gh-pages (orphan)
        # Force-orphan push — wipe the gh-pages branch entirely, then
        # commit only ./site/ + .nojekyll. Without the explicit
        # `git rm` of everything (or a fresh clone of an empty repo),
        # GitHub Pages' own pages-build-deployment will render a Jekyll
        # default theme if any non-mkdocs files leak through.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Add a nojekyll file so GitHub Pages serves the site as-is,
          # not via Jekyll interpretation. .nojekyll is meant to live at
          # the deployment root, so it goes straight into site/.
          touch site/.nojekyll
          # Wipe the index and stage site/ as the only content.
          # Force-add overrides the repo's .gitignore so site/ commits
          # even though it's gitignored at the repo root.
          git rm -rf --quiet . || true
          git add -f site/
          # Confirm what we're about to push. Fails loudly if site/ was
          # not generated (mkdocs build --strict would have failed first,
          # but this catches a missing OG / bench fallback).
          if [ ! -f site/index.html ]; then
            echo "ERROR: site/index.html not generated; aborting push" >&2
            ls -la site/ || true
            exit 1
          fi
          git commit -m "docs: rebuild mkdocs site (commit ${GITHUB_SHA})"
          # Push as orphan: use --force so a stale upstream HEAD doesn't
          # anchor an unrelated parent. `git push --force origin HEAD:gh-pages`.
          git push origin HEAD:gh-pages --force

      - name: Verify deployed URL
        run: |
          # Deployed site should be live at the project URL within ~30s.
          # Single retry handles cold-cache from CDNs.
          sleep 15
          curl -sfL "https://mine-fnl.github.io/qstocks-filing-tool/" -o /tmp/idx.html \
              || curl -sfL "https://mine-fnl.github.io/qstocks-filing-tool/" -o /tmp/idx.html
          if grep -q -i "jekyll\|404\|page not found" /tmp/idx.html; then
            echo "WARN: served index still shows Jekyll/404 — Pages deployment hasn't caught up yet. Skipping." >&2
          else
            echo "ok: served $(grep -oE '<title>[^<]*</title>' /tmp/idx.html | head -1)"
          fi
