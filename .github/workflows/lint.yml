name: lint

# Code-quality gate: ruff (lint + format check) + mypy (type check) on
# every PR + every push to main. Currently non-gating while the
# existing modules reach full type-hint coverage; flips to required
# once the core modules pass cleanly.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    # Currently non-gating while the existing modules reach clean state
    # against the new ruff config (introduced in this commit). Once the
    # tree is clean, drop `continue-on-error: true` from these steps.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: "ruff check"
        run: ruff check .
      - name: "ruff format --check"
        run: ruff format --check .

  mypy:
    name: mypy (type check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install mypy
      - name: mypy (non-gating check)
        continue-on-error: true
        run: |
          echo "## mypy report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          mypy --version >> "$GITHUB_STEP_SUMMARY" 2>&1
          mypy qscreen_ingest qscreen_gates qscreen_state \
                qscreen_fingerprint qscreen_langdetect qscreen_autodetect \
                --output-format=concise >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  cross-platform:
    name: cross-platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: "Smoke self-test"
        run: python -m qscreen_ingest --self-test
      - name: "Smoke tests"
        run: python -m pytest -q
