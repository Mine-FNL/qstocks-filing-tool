# .pre-commit-config.yaml
#
# Industry-standard pre-commit hooks: every commit is run through
# these locally before it reaches CI. Combined with the CI gate
# (lint.yml — ruff/mypy/cross-platform) the tree should never see a
# style violation or a secret in flight.
#
# Install:
#   pip install pre-commit
#   pre-commit install
#
# One-off run:
#   pre-commit run --all-files
#
# Skip on a specific commit (use sparingly):
#   git commit -m "..." --no-verify
#
# Why these hooks:
#   - pre-commit-hooks: baseline sanity (end-of-file, trailing-whitespace,
#     large-file check, merge-conflict markers, etc.) — same set the
#     Kubernetes, Django, and Pandas projects ship.
#   - ruff: matches the CI lint.yml selector/ignore list exactly so
#     local+CI never disagree.
#   - mypy: same flag set the CI lint job uses (--strict on the engine
#     modules, lenient elsewhere).
#   - check-yaml, check-json, check-toml: catches a class of "push a
#     broken workflow file" regressions.
#   - detect-secrets: catches accidentally committed API keys before
#     they leave the developer laptop.

repos:
  # ── baseline code hygiene ──────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        # .pre-commit-config.yaml itself (may contain !!python tags).
        # mkdocs.yml uses material/pymdownx Python-object YAML tags
        # (!!python/name:material.extensions.emoji.twemoji etc.) which
        # safe-load rejects. Skip it; CI runs mkdocs --strict for the
        # real test.
        # docs/site/*.md are not actually YAML files even with extension.
        exclude: '(\.pre-commit-config\.yaml|mkdocs\.ya?ml|docs/site/.*\.md)$'
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: mixed-line-ending
        args: [--fix=lf]

  # ── ruff — lint + format in CI (matches lint.yml exactly) ──────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ── NOTE: mypy is intentionally NOT in pre-commit ─────────────────────
  # CI runs mypy on the strict-typed engine modules only via the lint.yml
  # `mypy` job (qscreen_ingest, qscreen_gates, qscreen_state,
  # qscreen_fingerprint, qscreen_langdetect, qscreen_autodetect). Running
  # mypy on the full Python tree via pre-commit would surface 100+ latent
  # issues in not-yet-annotated modules (qscreen_analyze, qscreen_report,
  # etc.) and block commits the CI gate would let through.
  #
  # Run mypy locally if you want to pre-empt the CI check:
  #   .venv/bin/python -m mypy qscreen_ingest qscreen_gates qscreen_state \\
  #     qscreen_fingerprint qscreen_langdetect qscreen_autodetect

  # ── secret detection — runs locally, no server roundtrip needed ────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # baselines committed to .secrets.baseline so legitimate
        # test fixtures (sk-… keys in test_dotenv.py, etc.) don't get
        # flagged on every commit.
        args: [--baseline, .secrets.baseline]
        exclude: |
          (?x)^(
            tests/.*\.py
          )$

# ── global settings ───────────────────────────────────────────────────
default_language_version:
  python: python3
fail_fast: false
# Don't crawl the dist / build / venv noise.
exclude: |
  (?x)^(
    build/.*|
    dist/.*|
    site/.*|
    .*\.egg-info/.*|
    tests/golden/cases/.*
  )$
