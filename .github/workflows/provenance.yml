name: slsa-provenance

# SLSA Build L3 provenance for released wheels + sdists (+ SBOM).
#
# Triggered after release.yml publishes a tag (which already passed the
# bench regression gate, built the sdist+wheel, signed them with
# Sigstore, emitted the CycloneDX SBOM, and uploaded everything to
# GitHub Releases). We download the assets, hand them to GitHub's
# first-party `actions/attest-build-provenance@v1`, which writes an
# in-toto SLSA Provenance v1 attestation back to GitHub's artifact
# attestation API.
#
# Standards references:
#   - SLSA Build L3: https://slsa.dev/spec/v1.1/build-providing
#   - in-toto SLSA Provenance v1: https://github.com/in-toto/attestation/tree/main/provenance
#   - GitHub artifact attestations: https://docs.github.com/en/code-security/conveying-information-about-your-software/establishing-provenance-for-your-artifacts
#
# Why `actions/attest-build-provenance` and not `slsa-framework/slsa-github-generator`:
# The slsa-framework generator is a reusable workflow that owns its
# own build steps (`jobs.<id>.uses:`). Our release.yml owns the build
# (with its bench regression gate + Sigstore signing), so the
# build-once-then-attest-once pattern doesn't fit cleanly without
# restructuring release.yml. `actions/attest-build-provenance@v1` is
# the GitHub-native attestation action that takes pre-built files in
# `$GITHUB_WORKSPACE` as `subject-path`, generates the same SLSA v1
# attestation, and stores it in the artifact-attestation API. The
# resulting receipt is verifiable by `gh attestation verify` end-to-end.
#
# Verification (consumer side, after a release has been attested):
#   gh attestation verify dist/qscreen_filing_tool-1.6.1-py3-none-any.whl \
#     --owner Mine-FNL --repo qstocks-filing-tool

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attest (testing only; release.published fires automatically)"
        type: string
        required: true

permissions: read-all        # Scorecard Token-Permissions: write-scopes at job level only

jobs:
  attest-wheel:
    name: SLSA L3 — wheel
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # OIDC subject claim for the attestation
      attestations: write   # publish to the artifact-attestations API
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download wheel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir -p dist
          gh release download "$TAG" \
            --pattern "qscreen_filing_tool-*.whl" \
            --dir dist
          ls -lh dist/
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          # Glob is supported by the action; the resolved path is
          # included in the attestation subject.
          subject-path: 'dist/qscreen_filing_tool-*.whl'

  attest-sdist:
    name: SLSA L3 — sdist
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # OIDC subject claim for the attestation
      attestations: write   # publish to the artifact-attestations API
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download sdist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir -p dist
          gh release download "$TAG" \
            --pattern "qscreen_filing_tool-*.tar.gz" \
            --dir dist
          ls -lh dist/
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/qscreen_filing_tool-*.tar.gz'

  attest-sbom:
    name: SLSA L3 — SBOM
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # OIDC subject claim for the attestation
      attestations: write   # publish to the artifact-attestations API
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download SBOM (best-effort)
        # Older releases (e.g. v1.6.1, v1.6.0) predate the SBOM step and
        # therefore have no sbom.cdx.json asset attached. Don't fail the
        # whole provenance run on this — the wheel + sdist jobs attest the
        # code-level SLSA receipt either way.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir -p dist
          gh release download "$TAG" \
            --pattern "sbom.cdx.json" \
            --dir dist || echo "WARN: no sbom.cdx.json on this release (older release)"
          ls -lh dist/
      - name: Attest build provenance
        if: hashFiles('dist/sbom.cdx.json') != ''
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/sbom.cdx.json'
