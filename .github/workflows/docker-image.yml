name: docker-image

# Build and push a multi-arch container image to GitHub Container
# Registry (ghcr.io) on every release tag. The same image also runs
# in CI to prove the Dockerfile is reproducible.
#
# Why this is a workaround for the PyPI blocker:
# PyPI Trusted Publishers needs a one-time maintainer UI click on
# pypi.org/manage/account/publishing/ that we can't execute from
# CI. ghcr.io uses the same OIDC identity (`permissions: packages:
# write` + `GITHUB_TOKEN`) with no external registration — every
# tag automatically becomes a container image.
#
# This gives us a parallel install path:
#   docker pull ghcr.io/Mine-FNL/qstocks-filing-tool:vX.Y.Z
#   docker run --rm -p 8765:8765 ghcr.io/Mine-FNL/qstocks-filing-tool:vX.Y.Z
# Plus an attached OCI SBOM (syft-generated) and a multi-arch build
# (linux/amd64 + linux/arm64) so it runs on Apple Silicon / Graviton.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: read-all        # Scorecard Token-Permissions: write-scopes at job level only

concurrency:
  group: docker-image
  cancel-in-progress: false   # never cancel mid-image-push

jobs:
  build:
    name: Build + push (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write       # push to ghcr.io
      attestations: write   # action generates SLSA-provenance for the image
      id-token: write       # OIDC for the cosign sign step
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io (OIDC fallback uses GITHUB_TOKEN)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/Mine-FNL/qstocks-filing-tool
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build + push (with provenance + SBOM)
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit produces SBOM + SLSA provenance inline, writes them
          # to local files; we re-publish them as release assets via the
          # provenance.yml workflow.
          provenance: true
          sbom: true

  lint:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-latest
    continue-on-error: true   # non-blocking until the Dockerfile is final
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
