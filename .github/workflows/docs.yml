name: docs

# Build the mkdocs site (--strict) and publish it to the gh-pages branch
# on every change to docs/, mkdocs.yml, or docs/build_demo.py.
#
# Interaction with release.yml
# -----------------------------
# release.yml (tag push) ALSO commits to the gh-pages branch:
#   - simple/qscreen-filing-tool/index.html   (PEP 503 index)
#   - index.html                              (package-name-on-root fallback)
#   - demo.html                               (live bench report)
#
# Those files live at sub-paths of gh-pages; the mkdocs site produced
# by this workflow is the *root* (./index.html, ./install/, ./usage/, ...).
# With force_orphan=true, peaceiris/actions-gh-pages REPLACES the gh-pages
# branch contents with ./site/. release.yml will re-publish its sub-path
# files on the next v* tag push, restoring the index + demo. Until then,
# the simple/ and /demo.html URLs will 404 — this is the trade-off for a
# clean orphan root (no stale mkdocs assets from a deleted page).
#
# If you ever want both this site's root AND the release.yml sub-paths to
# coexist without the orphan reset, switch force_orphan=false and rely on
# path isolation: the mkdocs build only writes ./site/ and the release
# workflow only writes ./simple/ + ./index.html + ./demo.html. They do
# not collide; force_orphan is purely cosmetic for this repo.

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "docs/SHOW_HN.md"
      - "docs/build_demo.py"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions: read-all        # Scorecard Token-Permissions: write-scopes at job level only

concurrency:
  group: docs
  cancel-in-progress: false   # never cancel an in-flight publish

jobs:
  build-and-deploy:
    name: Build mkdocs + publish to gh-pages
    runs-on: ubuntu-latest
    permissions:
      contents: write      # commit the site/ tree to gh-pages
      pages: write         # allowed to publish to Pages
      id-token: write      # ready for downstream OIDC (future)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0    # mkdocs reads git history for "edit this page"
          # NOTE: persist-credentials intentionally left default (true) here —
          # the custom force_orphan step below does `git push origin
          # HEAD:gh-pages --force` and needs the GITHUB_TOKEN cached by
          # actions/checkout. The other Scorecard-suggested settings (top-
          # level permissions: read-all, job-level contents/pages/id-token:
          # write) still apply.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install mkdocs + material + pillow
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs mkdocs-material pillow
          pip install -e ".[dev]"

      - name: Build mkdocs (--strict)
        # Build the mkdocs site FIRST. By default `mkdocs build` clears
        # the site/ directory before regenerating, so anything we want
        # to land alongside it (demo.html + og.png) must be written AFTER
        # this step. See "Build live bench JSON + demo HTML + OG image"
        # below.
        run: python -m mkdocs build --strict

      - name: Build live bench JSON + demo HTML + OG image
        # Now that the mkdocs site is in place, layer on the bench
        # artifacts (do NOT use --strict-friendly as a flag; this builds
        # to disk even if qscreen_eval.py exits 1 on a bench regression).
        run: |
          # qscreen_eval.py exits non-zero on bench regressions (that's
          # its design — it's the regression detector). For docs we
          # just want a representative snapshot, so capture the JSON
          # output even if the exit code is non-zero.
          python qscreen_eval.py --json --out /tmp/bench.json || true
          python docs/build_demo.py /tmp/bench.json \
              --out site/demo.html \
              --og site/og.png || true
          ls -lh site/demo.html site/og.png site/index.html

      - name: Deploy to gh-pages (orphan, content at root)
        # Force-orphan push — wipe the gh-pages branch entirely, then
        # commit ./site/* as the deployment root (not under site/, since
        # GitHub Pages serves the branch root at the project URL).
        # Without this, anything stage from /site/ ends up at the URL
        # prefix /site/ and GitHub Pages renders a Jekyll default at
        # / — visitors never see the actual content.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Add a nojekyll file so GitHub Pages serves the site as-is,
          # not via Jekyll interpretation. .nojekyll belongs at the
          # deployment root, which IS the project URL root, so it
          # lands straight inside site/.
          touch site/.nojekyll
          # Wipe whatever the checkout has, then add site/* AS THE ROOT.
          # `git rm -r --cached --force site/*` keeps the working dir
          # intact while removing any previous index entries; the
          # subsequent `git add .` then stages only what's in cwd.
          if [ -n "$(git ls-files)" ]; then
            git rm -r --cached --quiet --ignore-unmatch . || true
          fi
          # Now move the site/ contents up to cwd so they land at the
          # gh-pages branch root, not under site/.
          shopt -s dotglob nullglob
          mv site/* . 2>/dev/null || true
          rmdir site/ 2>/dev/null || true
          # Stage everything EXCEPT .github/ — GitHub rejects a force-push
          # from a GitHub App that touches workflow files without an
          # explicit `workflows:` permission. The mkdocs site doesn't
          # need .github/ on gh-pages (the demo.html + simple/ index
          # from release.yml are still pushed by release.yml, which has
          # the right permissions).
          git add -A ':!.github' ':!.gitignore'
          if [ ! -f index.html ]; then
            echo "ERROR: index.html not generated; aborting push" >&2
            ls -la || true
            exit 1
          fi
          git commit -m "docs: rebuild mkdocs site (commit ${GITHUB_SHA})"
          git push origin HEAD:gh-pages --force

      - name: Verify deployed URL
        run: |
          sleep 20
          curl -sfL "https://mine-fnl.github.io/qstocks-filing-tool/" -o /tmp/idx.html
          TITLE=$(grep -oE '<title>[^<]*</title>' /tmp/idx.html | head -1)
          if grep -q -i "page not found" /tmp/idx.html; then
            echo "WARN: served index shows 404 — Pages deployment hasn't caught up yet. Skipping." >&2
            exit 0
          fi
          echo "ok: served $TITLE"
