name: bench

# PR-time + main + nightly bench gate.
#
# Runs the golden-set evaluation on every PR push and on every push to
# main. Refuses to merge / publish when the bench regresses below the
# captured baseline (currently 80.6% / 100 of 124 checks).
#
# Plus: a weekly cron run that posts the latest accuracy to the Actions
# step summary, so silent dependency regressions surface on the dashboard.

on:
  pull_request:
    branches: [main]
    paths:
      - "qscreen_ingest.py"
      - "qscreen_gates.py"
      - "qscreen_state.py"
      - "qscreen_eval.py"
      - "qscreen_autodetect.py"
      - "qscreen_langdetect.py"
      - "qscreen_fingerprint.py"
      - "profiles/**"
      - "tests/golden/**"
      - "pyproject.toml"
      - ".github/workflows/bench.yml"
  push:
    branches: [main]
    paths:
      - "qscreen_ingest.py"
      - "qscreen_gates.py"
      - "qscreen_state.py"
      - "qscreen_eval.py"
      - "qscreen_autodetect.py"
      - "qscreen_langdetect.py"
      - "qscreen_fingerprint.py"
      - "profiles/**"
      - "tests/golden/**"
      - "pyproject.toml"
      - ".github/workflows/bench.yml"
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC — first thing in the work-week.
    - cron: "0 6 * * 1"

permissions: read-all        # Scorecard Token-Permissions: write-scopes at job level only

concurrency:
  group: bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Golden-set eval
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write   # for the bench-summary PR comment
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run bench + parse aggregate
        id: bench
        run: |
          # qscreen_eval.py exits non-zero on any check failure; we
          # capture the JSON anyway and parse the aggregate ratio.
          python qscreen_eval.py --json --out bench.json || true

          python -c "
          import json, sys
          d = json.load(open('bench.json'))
          cases = d['cases']
          total_score = sum(c['score'] for c in cases)
          total_checks = sum(c['total'] for c in cases)
          cases_with_checks = sum(1 for c in cases if c['total'] > 0)
          # Distinguish engine failure from true regression (same pattern
          # as release.yml). A 0.0% ratio is almost always an engine
          # failure (missing golden cases, import error, broken state),
          # not a real regression — give it a distinct error so the
          # bench PR comment makes the diagnosis obvious.
          if total_checks == 0:
              print('::error::Bench engine produced 0 total checks — not a regression, an engine failure.')
              print(f'  cases={len(cases)} total_score={total_score} total_checks={total_checks}')
              sys.exit(2)
          if cases_with_checks > 0 and total_score == 0:
              print('::error::Bench engine scored 0 on every case — not a regression, an engine failure.')
              print(f'  cases={len(cases)} total_score={total_score} total_checks={total_checks}')
              sys.exit(2)
          ratio = total_score / total_checks
          print(f\"Bench: {total_score}/{total_checks} ({ratio*100:.1f}%)\")
          print('Per-case:')
          for c in cases:
              mark = 'OK ' if c['score'] == c['total'] else 'WARN'
              print(f\"  {mark} {c['case']:<24s}  {c['score']}/{c['total']}\")
          print(f\"BENCH_RATIO={round(ratio, 4)}\")
          " | tee bench-summary.txt

          if ! grep -q '^BENCH_RATIO=' bench-summary.txt; then
            echo "ratio=" >> "$GITHUB_OUTPUT"
            exit 2
          fi

          RATIO=$(grep -oE 'BENCH_RATIO=[0-9.]+' bench-summary.txt | head -1 | cut -d= -f2)
          echo "Computed ratio: $RATIO"
          echo "ratio=$RATIO" >> "$GITHUB_OUTPUT"

      - name: Enforce regression gate
        env:
          RATIO: ${{ steps.bench.outputs.ratio }}
        run: |
          python -c "
          import os, sys
          ratio_raw = os.environ.get('RATIO', '').strip()
          if not ratio_raw:
              print('::error::RATIO is empty — bench engine failed before ratio was computed.')
              sys.exit(1)
          try:
              ratio = float(ratio_raw)
          except ValueError:
              print(f'::error::RATIO is not a float: {ratio_raw!r}')
              sys.exit(1)
          baseline = 0.806   # 100/124 = 80.6%, captured 2026-09-17
          if ratio < baseline:
              print(f'::error::Bench regressed: {ratio*100:.1f}% < baseline {baseline*100:.1f}%')
              sys.exit(1)
          print(f'Bench OK: {ratio*100:.1f}% >= baseline {baseline*100:.1f}%')
          "

      - name: Publish step summary
        if: always()
        run: |
          python - <<'PYEOF' > bench-summary.md
          import json
          d = json.load(open('bench.json'))
          cases = d['cases']
          total_score = sum(c['score'] for c in cases)
          total_checks = sum(c['total'] for c in cases)
          ratio = total_score / total_checks if total_checks else 0
          print('## Golden-set bench')
          print()
          print('| Case | Score |')
          print('| --- | --- |')
          for c in cases:
              mark = 'OK' if c['score'] == c['total'] else 'WARN'
              print(f"| {mark} `{c['case']}` | {c['score']}/{c['total']} |")
          print()
          print(f"**Aggregate: {total_score} / {total_checks} checks pass ({ratio*100:.1f}%).**")
          print()
          print(f"Baseline gate: **must be >= 80.6%** (currently {ratio*100:.1f}%).")
          PYEOF
          cat bench-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build PR comment body
        if: github.event_name == 'pull_request' && always()
        run: |
          python - <<'PYEOF' > bench-comment.md
          import json
          d = json.load(open('bench.json'))
          cases = d['cases']
          total_score = sum(c['score'] for c in cases)
          total_checks = sum(c['total'] for c in cases)
          ratio = total_score / total_checks if total_checks else 0
          print('## Golden-set bench')
          print()
          print('| Case | Score |')
          print('| --- | --- |')
          for c in cases:
              mark = 'OK' if c['score'] == c['total'] else 'WARN'
              print(f"| {mark} `{c['case']}` | {c['score']}/{c['total']} |")
          print()
          print(f"**Aggregate: {total_score} / {total_checks} checks pass ({ratio*100:.1f}%).**")
          print()
          print(f"Baseline gate: **must be >= 80.6%** (currently {ratio*100:.1f}%).")
          PYEOF
          cat bench-comment.md

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: bench
          path: bench-comment.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-json-${{ github.event.pull_request.number || github.ref_name }}
          path: bench.json
