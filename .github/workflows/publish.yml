name: publish

# Publishes qscreen-filing-tool to PyPI without an API token, using
# PyPI Trusted Publishers (PEP 740 / OpenID Connect). The publisher
# link is registered one-time on PyPI's side, then this workflow can
# publish forever without anyone pasting secrets.
#
# Triggered by:
#  - manual `workflow_dispatch` ONLY.
#    (Previously fired on every `v*` tag push, but the PyPI trusted
#     publisher was never registered, so every release got a noisy
#     "Publisher with matching claims was not found" failure. Users
#     install from GitHub Releases CDN or the Pages-hosted PEP 503
#     simple index instead — see README §Install. Keep this workflow
#     dormant until the maintainer has registered the pending publisher
#     on https://pypi.org/manage/account/publishing/ and wants to
#     revive it.)
#
# Prerequisites (one-time, maintainer action):
#  - On https://pypi.org/manage/account/publishing/ add a pending
#    publisher for project `qscreen-filing-tool`, pointing at this
#    GitHub repo and this workflow filename. See RUNBOOK.md §"PyPI
#    Trusted Publisher setup".
#  - Then re-add `push: tags: ['v*']` under `on:` to re-enable tag
#    auto-publish.

on:
  workflow_dispatch:

permissions: read-all        # Scorecard Token-Permissions: write-scopes at job level only

jobs:
  publish:
    name: Build + publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for PyPI's OIDC trusted-publisher flow
    steps:
      - uses: actions/checkout@v4
        with:
          # PyPI trust on tags only — fetch the full history so
          # setuptools-scm / version discovery is stable, but enforce
          # that we're building from a tagged commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist + wheel
        run: |
          python -m build --sdist --wheel
          ls -lh dist/

      - name: Publish to PyPI (Trusted Publisher, OIDC)
        # NOTE: no `repository-url: https://test.pypi.org/...` here —
        # we publish to prod PyPI by default. For test runs, change
        # this to point at test.pypi.org (and add a matching pending
        # publisher on test.pypi.org).
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Skip the legacy "user/password" inputs entirely. PyPI's
          # action picks up the OIDC token from `id-token: write`
          # above and matches it against the pending publisher that
          # was registered one-time on pypi.org.
          packages-dir: dist/
          # Verifies artifacts via pyproject.toml metadata before
          # upload — fails fast on a missing field or a bad signature.
          verify-metadata: true
          # Useful on tag pushes: skip the "did you mean to publish a
          # prerelease?" prompt. Has no effect on workflow_dispatch.
          skip-existing: true
