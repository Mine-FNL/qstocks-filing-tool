name: Discussion — Release announcement

# Creates a GitHub Discussion in the Announcements category whenever a
# release is published. Subscribers to the repo (RSS, email) see the
# release post without needing to watch Releases.
#
# This is the project's "no-user-action-needed" external lift: any
# release tag now automatically publishes a public Discussion post that
# surfaces in the repo's activity feed and is indexable by tech-news
# aggregators.
#
# The actual GraphQL call lives in scripts/post-discussion.py so the
# workflow YAML stays compact and the script is unit-testable in CI.

on:
  release:
    types: [published]
  workflow_dispatch:        # manual trigger for re-posting a release
    inputs:
      tag:
        description: "Release tag (e.g. v1.7.0). Required for manual runs."
        required: false
      name:
        description: "Release display name. Required for manual runs."
        required: false
      url:
        description: "Release HTML URL. Optional — defaults to a placeholder."
        required: false
      body:
        description: "Release notes body (markdown). Optional — falls back to a generic template."
        required: false

permissions: read-all        # Scorecard Token-Permissions: write at job level only

jobs:
  announce:
    name: Post release announcement
    runs-on: ubuntu-latest
    permissions:
      discussions: write    # required to create Discussion posts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Post Discussion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # On release events, populate from the payload. On
          # workflow_dispatch, use the manual inputs (post-discussion.py
          # validates them and hard-fails if TAG/NAME are empty).
          TAG:      ${{ github.event.release.tag_name      || inputs.tag }}
          NAME:     ${{ github.event.release.name          || inputs.name }}
          URL:      ${{ github.event.release.html_url      || inputs.url }}
          BODY:     ${{ github.event.release.body          || inputs.body }}
        run: python3 scripts/post-discussion.py
