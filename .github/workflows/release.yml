name: release

# Full automated release pipeline:
#   tag push → bench regression gate → build → GitHub Release upload →
#   (optional) gh-pages index update for the PEP 503 simple index.
#
# The bench gate REFUSES to publish if check-level accuracy regresses
# below the captured baseline (currently 100/124 = 80.6%). This means
# a regression in extraction logic can never silently ship to PyPI /
# GitHub Releases / a stranger's `pip install`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      skip_bench:
        description: "Skip bench regression gate (use only for non-engine changes)"
        type: boolean
        default: false

permissions: read-all        # Scorecard Token-Permissions: write-scopes at job level only

concurrency:
  group: release
  cancel-in-progress: false   # never cancel a release mid-flight

jobs:
  bench:
    name: Bench regression gate
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_bench }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run golden-set eval
        id: bench
        run: |
          # qscreen_eval.py exits non-zero whenever any check fails
          # (by design — it's a regression detector). For the publish
          # gate we only care about the aggregate ratio, so capture
          # the JSON output and ignore the exit code.
          python qscreen_eval.py --json --out bench.json || true

          # Compute and print the ratio, plus per-case summary, in
          # one python invocation. The last line is the ratio on
          # its own line, easy to grep.
          #
          # NB: each case dict has `passed` (bool — case-level pass
          # flag) and `score` (int — count of passing checks within
          # the case). We want `score` for the aggregate ratio.
          python -c "
          import json, sys
          d = json.load(open('bench.json'))
          cases = d['cases']
          total_score = sum(c['score'] for c in cases)
          total_checks = sum(c['total'] for c in cases)
          cases_with_checks = sum(1 for c in cases if c['total'] > 0)
          # Detect engine failure vs true regression:
          #   - 'no_checks' = bench.json had zero total checks → engine
          #     never produced output (CLI flag mismatch, import error,
          #     missing golden cases). NOT a regression.
          #   - 'zero_score' = engine ran but every case scored 0 → an
          #     extraction / model / env failure masked as regression.
          # Both should block the release, but with a clearer message.
          if total_checks == 0:
              print('::error::Bench engine produced 0 total checks — not a regression, an engine failure.')
              print(f'  cases={len(cases)} total_score={total_score} total_checks={total_checks}')
              sys.exit(2)
          if cases_with_checks > 0 and total_score == 0:
              print('::error::Bench engine scored 0 on every case — not a regression, an engine failure.')
              print(f'  cases={len(cases)} total_score={total_score} total_checks={total_checks}')
              sys.exit(2)
          ratio = total_score / total_checks
          print(f\"Bench: {total_score}/{total_checks} ({ratio*100:.1f}%)\")
          print('Per-case:')
          for c in cases:
              mark = 'OK ' if c['score'] == c['total'] else 'WARN'
              print(f\"  {mark} {c['case']:<24s}  {c['score']}/{c['total']}\")
          print(f\"BENCH_RATIO={round(ratio, 4)}\")
          " | tee bench-summary.txt

          # If bench engine failed, the script exited 2 and we never
          # wrote BENCH_RATIO — make the regression gate honor that.
          if ! grep -q '^BENCH_RATIO=' bench-summary.txt; then
            echo "ratio=" >> "$GITHUB_OUTPUT"
            exit 2
          fi

          RATIO=$(grep -oE 'BENCH_RATIO=[0-9.]+' bench-summary.txt | head -1 | cut -d= -f2)
          echo "Computed ratio: '$RATIO'"
          echo "ratio=$RATIO" >> "$GITHUB_OUTPUT"
      - name: Enforce regression gate
        env:
          RATIO: ${{ steps.bench.outputs.ratio }}
        run: |
          python -c "
          import os, sys
          ratio_raw = os.environ.get('RATIO', '').strip()
          if not ratio_raw:
              print('::error::RATIO is empty — bench engine failed before ratio was computed.')
              sys.exit(1)
          try:
              ratio = float(ratio_raw)
          except ValueError:
              print(f'::error::RATIO is not a float: {ratio_raw!r}')
              sys.exit(1)
          baseline = 0.806   # 100/124 = 80.6%, captured 2026-09-17
          if ratio < baseline:
              print(f'::error::Bench regressed: {ratio*100:.1f}% < baseline {baseline*100:.1f}%')
              sys.exit(1)
          print(f'Bench OK: {ratio*100:.1f}% >= baseline {baseline*100:.1f}%')
          "
      - uses: actions/upload-artifact@v7
        with:
          name: bench-json
          path: bench.json

  publish:
    name: Build + publish
    needs: bench
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create release, upload assets
      pages: write        # update gh-pages branch
      id-token: write     # ready for PyPI Trusted Publishers
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          # `cyclonedx-bom` ships the `cyclonedx-py` CLI; the workflow
          # uses `cyclonedx-py environment` to emit the SBOM. Earlier
          # revisions of this workflow referenced `cyclonedx-py-mod`,
          # which is not a real PyPI name and silently no-op'd the
          # SBOM step on every release.
          pip install build cyclonedx-bom
      - name: Build sdist + wheel
        run: |
          python -m build --sdist --wheel
          ls -lh dist/
      - name: Generate SBOM (CycloneDX)
        # CycloneDX is the de-facto standard for software bill of materials
        # in SBOM-aware supply-chain tooling (Grype, Trivy, Dependency-Track).
        # We emit a single .cdx.json covering both the wheel + sdist and
        # attach it as a release asset. Downstream auditors and vulnerability
        # scanners can correlate component → CVE via this file.
        run: |
          cyclonedx-py environment --output-format JSON --output-file dist/sbom.cdx.json
          # Pin a reproducible format version so consumers don't have to
          # cope with schema drift between releases.
          python -c "import json; d=json.load(open('dist/sbom.cdx.json')); d.setdefault('specVersion','1.5'); d.setdefault('serialNumber','urn:uuid:$(uuidgen)'); d.setdefault('metadata',{})['timestamp']='$(date -u +%Y-%m-%dT%H:%M:%SZ)'; json.dump(d, open('dist/sbom.cdx.json','w'), indent=2)"
          ls -lh dist/sbom.cdx.json
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # If a release with this tag already exists, this adds assets
          # to it. If not, it creates one. `--draft` could gate this if
          # you want a manual "publish" step before the world sees it.
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.cdx.json
          generate_release_notes: true
          fail_on_unmatched_files: true
      - name: Sign artifacts with Sigstore
        # Keyless OIDC signing — no long-lived secret material to leak.
        # Produces `<file>.sig` and a certificate `<file>.crt` for each
        # artifact; we upload the bundle to GitHub Releases so consumers
        # can verify provenance with `cosign verify-blob` against the
        # OIDC identity of this workflow (commit SHA + repo + workflow
        # name). Failures are non-blocking (warn-only) — a Sigstore
        # outage should not block a release.
        id: sigstore
        uses: sigstore/gh-action-sigstore-python@v1.2.0
        with:
          inputs: |
            dist/*.whl
            dist/*.tar.gz
        env:
          SIGSTORE_REKOR_URL: https://rekor.sigstore.dev
      - name: Upload signatures to GitHub Release
        if: success() || failure()
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.sig
            dist/*.crt
          fail_on_unmatched_files: false
          verbose: false
      - name: Update gh-pages simple index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          WHEEL=$(ls dist/*.whl | head -1)
          SDIST=$(ls dist/*.tar.gz | head -1)
          WHEEL_NAME=$(basename "$WHEEL")
          SDIST_NAME=$(basename "$SDIST")
          WHEEL_SHA=$(sha256sum "$WHEEL" | awk '{print $1}')
          SDIST_SHA=$(sha256sum "$SDIST" | awk '{print $1}')

          WORK=$(mktemp -d)
          git clone --depth=1 --branch=gh-pages \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "$WORK"
          cd "$WORK"

          mkdir -p simple/qscreen-filing-tool
          cat > simple/qscreen-filing-tool/index.html <<EOF
          <!DOCTYPE html>
          <html>
            <head>
              <meta name="pypi:repository-version" content="1.0">
              <title>Links for qscreen-filing-tool</title>
            </head>
            <body>
              <h1>Links for qscreen-filing-tool</h1>
              <a href="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${WHEEL_NAME}#sha256=${WHEEL_SHA}" data-requires-python="&gt;=3.9" rel="internal">${WHEEL_NAME}</a><br/>
              <a href="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${SDIST_NAME}#sha256=${SDIST_SHA}" data-requires-python="&gt;=3.9" rel="internal">${SDIST_NAME}</a><br/>
            </body>
          </html>
          EOF

          # Also keep the package-name-on-root fallback so
          # `--index-url <base>/` works without trailing `/simple/`.
          cp simple/qscreen-filing-tool/index.html index.html

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add simple/ index.html
          git diff --cached --quiet || git commit -m "gh-pages: bump index to ${TAG}"
          git push origin gh-pages
      - name: Verify final state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" --json assets,tagName \
            --jq '"release: " + .tagName + " assets: " + ([.assets[].name] | join(", "))'
